<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>BSIT COMPILATION</title>
</head>
<body>
    <div class="cards-container">
        
        <div class="card" data-student="baldago">
            <div class="wrapper">
                <img src="../IMG/baldago.jpg" class="cover-img">
            </div>
            <img src="../IMG/baldago_title.jpg" class="title">
            <img src="../IMG/baldago_alone.png" class="character">
        </div>
        <div class="card" data-student="bads">
            <div class="wrapper">
                <img src="../IMG/bads.jpg" class="cover-img">
            </div>
            <img src="../IMG/bads_title.jpg" class="title">
            <img src="../IMG/bads_alone.png" class="character">
        </div>
        <div class="card" data-student="briones">
            <div class="wrapper">
                <img src="../IMG/briones.jpg" class="cover-img">
            </div>
            <img src="../IMG/briones_title.jpg" class="title">
            <img src="../IMG/briones_alone.png" class="character">
        </div>
        <div class="card" data-student="sison">
            <div class="wrapper">
                <img src="../IMG/sison.jpg" class="cover-img">
            </div>
            <img src="../IMG/sison_title.png" class="title">
            <img src="../IMG/sison_alone.png" class="character">
        </div>
    </div>
    <h1>CHOOSE YOUR STUDENT</h1>
    <button id="confirmBtn" class="hide">Confirm</button>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.card').forEach((card, i) => {
            card.style.animationDelay = `${i * 0.37}s`;
        });
    });
        let selectedValue = "";
        document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function() {
        // Remove 'selected' from all cards
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        this.classList.add('selected');
        document.getElementById('confirmBtn').classList.remove('hide');
        // Remove all possible background classes from body
        document.body.classList.remove('baldago-bg', 'briones-bg', 'sison-bg', 'bads-bg');

        // Add the new background class based on data-student
        const student = this.getAttribute('data-student');
        if (student) {
            document.body.classList.add(`${student}-bg`);
            selectedValue = student; 
        }
    });
});

        document.getElementById('confirmBtn').onclick = function() {
            if (selectedValue) {
                const studentPageMap = {
                    'baldago': 'Baldago_sub.html',
                    'briones': 'Briones_sub.html',
                    'sison': 'Sison_sub.html',
                    'bads': 'Bads_sub.html'
                };
                window.location.href = studentPageMap[selectedValue];
            } else {
                alert('Please Select the following Students.');
            }
            
        };
    </script>
</body>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo Description with Background</title>

    <style>
        body {
            background: url('/IMG/Bglogo1.PNG') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            background-blend-mode: darken;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
        }
        
        .photo-container {
            display: flex;
            gap: 25px;
            margin-bottom: 20px;
        }
        
        .photo {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.7);
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .photo:hover {
            transform: scale(1.05);
            border-color: gold;
            box-shadow: 0 0 20px gold;
        }
        
        #description {
            max-width: 700px;
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 40px;
        }
        /* CONTACT SECTION FIXED */
        
        #contact {
            background: rgba(0, 0, 0, 0.7);
            max-width: 600px;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            line-height: 1.6;
            margin-top: 20px;
            text-align: center;
        }
        
        #contact h2 {
            font-family: 'Brush Script MT', cursive;
            font-size: 38px;
            margin-bottom: 15px;
        }
        
        #contact strong {
            font-weight: bold;
        }
        
        #follow {
            margin-top: 25px;
            font-style: italic;
        }

        button{
    border-radius: 5px;
    filter: drop-shadow(10px 10px 10px #333);
    padding: 15px;
    cursor: pointer;
}
a {
  color: white;
  text-decoration: none;
}

.header {
  position: fixed;
  top: -1100px;
  background-color: black;
  color: white;
  width: 100%;
  height: 100%;
  z-index: 10;
  transition: all 3s;
  filter: blur(100px);
}

.homePic {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.show {
  top: 0px;
  filter: blur(0px);
}

.btnCLick {
  z-index: 11;
  position: absolute;
  top: 30px;
  left: 100px;
  transition: all 3s;
}

.opacity {
  opacity: 0;
  left: -500px;
}

#btnClose {
  position: absolute;
  top: 30px;
  left: -600px;
}

.navdiv {
  color: white;
  position: absolute;
  top: 50px;
  left: 650px;
  transition: all 3s;
  text-align: center;
  justify-content: center;
}

ul {
  display: flex;
  justify-content: center;
  align-items: center;
  list-style: none;
}


ul .list {
  margin: 20px;
  list-style: none;
  display: inline-block;
  padding: 10px;
  opacity: 0;
  position: relative;
  font-size: 50px;
  top: 300px;
  right: 30%;
  transition: all 1s;
  pointer-events: none;
}

.showList{
   animation: fadeIn 2s ease-in forwards;
   
}

ul li:nth-child(1) {
  animation-delay: 3s;
}
ul li:nth-child(2) {
  animation-delay: 3.3s;
}
ul li:nth-child(3) {
  animation-delay: 3.6s;
}
ul li:nth-child(4) {
  animation-delay: 3.9s;
}
ul li:nth-child(5) {
  animation-delay: 4.2s;
}
@keyframes fadeIn {
  100% {
    opacity: 1;
    pointer-events: auto;
  }
}
ul:hover > :not(:hover) {
  filter: blur(20px);
  font-size: 40px;
  padding:20px;
  
  
}
    </style>
</head>

<body>
    <header class="header" id="header">
      <image class="homePic" id="homePic" src="../IMG/home.png" alt="headerBG"></image>
      <nav>
        <div class="navdiv appear">
          <ul>
            <li class="list "><a href="../MORIS/feurmoris.html"> HOME </a></li>
            <li class="list "><a href="../MORIS/Moris3-4.html"> ABOUT </a></li>
            <li class="list "><a href="../MORIS/article_select.html"> ARTICLES </a></li>
            <li class="list "><a href="../MORIS/Contact_sponsor.html"> CONTACTS </a></li>
            <li class="list "><a href="../MORIS/Contact_sponsor.html"> PARTNERSHIPS </a></li>
          </ul>
          <button class="btnClose" id="btnClose">exit</button>
        </div>
      </nav>
    </header>

    <button class="btnCLick" id="btnClick">click me</button>

    <div class="photo-container">
        <img src="/IMG/Leader1.PNG" alt="Ms. Denise Ann" class="photo" id="denisePhoto">
        <img src="/IMG/Teacher1.PNG" alt="Mr. Jason Carlos" class="photo" id="jasonPhoto">
    </div>

    <div id="description">Click on a photo to see the description.</div>

    <!-- CONTACT SECTION -->
    <div id="contact"></div>

    <script>
        function showContactUs() {
            const contactDiv = document.getElementById('contact');
            contactDiv.innerHTML = `
                <h2>CONTACT US</h2>
                <p><strong>Email:</strong> feurmoris.magazine@gmail.com</p>
                <p><strong>Department:</strong> FEU Roosevelt – BSBA Marketing Management Department</p>
                <p><strong>Location:</strong> Cainta, Rizal, Philippines</p>
                <p id="follow"><em>Follow us for more Tamaraw stories, student features, and creative journeys — straight from the heart of FEU Roosevelt!</em></p>
            `;
        }
        showContactUs();
    </script>

    <script>
        const descriptions = {
            denise: `
                <h3>Ms. Denise Ann</h3>
                <p><strong>From culinary dreams to marketing journeys: A story of faith, perseverance, and growth.</strong></p>
                <p>She once dreamed of becoming a chef, but now she cooks up stories and strategies with the same passion, this time as a marketer. Her FEU Roosevelt journey was far from easy: sleepless nights, endless projects, and the weight of leadership tested her in ways she never imagined.</p>
                <p>Through faith, friendship, and fierce determination, she learned that true leadership isn’t measured by titles or achievements; it’s defined by empathy, patience, and heart.</p>
                <p>From designing the official SINAG TAMARAW 2023 logo to stepping boldly into her first job, she continues to prove that real growth begins when you choose courage over comfort and never stop believing in your own story.</p>
            `,
            jason: `
                <h3>Mr. Jason Carlos</h3>
                <p><strong>The heart that never left: A teacher’s journey through time.</strong></p>
                <p>From chalkboards to AI — Sir Jason Carlos has seen it all. A true-blooded Rooseveltian, he began his journey as a student in 1991 and has spent nearly 30 years shaping minds at FEU Roosevelt.</p>
                <p>His story is one of passion, resilience, and transformation — proving that while tools may change, the heart of teaching remains the same.</p>
                <p>Discover how one teacher’s legacy continues to inspire generations of Tamaraws.</p>
            `
        };

        document.getElementById('denisePhoto').addEventListener('click', () => {
            document.getElementById('description').innerHTML = descriptions.denise;
        });

        document.getElementById('jasonPhoto').addEventListener('click', () => {
            document.getElementById('description').innerHTML = descriptions.jason;
        });
    </script>
    <script src="../JS/feurmoris.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/article_select.css">
    
</head>
<body>

    <header class="header" id="header">
      <image class="homePic" id="homePic" src="../IMG/home.png" alt="headerBG"></image>
      <nav>
        <div class="navdiv appear">
          <ul>
            <li class="list "><a href="../MORIS/feurmoris.html"> HOME </a></li>
            <li class="list "><a href="../MORIS/Moris3-4.html"> ABOUT </a></li>
            <li class="list "><a href="../MORIS/article_select.html"> ARTICLES </a></li>
            <li class="list "><a href="../MORIS/Contact_sponsor.html"> CONTACTS </a></li>
            <li class="list "><a href="../MORIS/Contact_sponsor.html"> PARTNERSHIPS </a></li>
          </ul>
          <button class="btnClose" id="btnClose">exit</button>
        </div>
      </nav>
    </header>

    <button class="btnCLick" id="btnClick">click me</button>
    <div class="container">
    <!--Cover Article-->
    <div class="holder">
        <input class="cont" type="radio" name="services" value="cover" checked>
        <span>
            <div class="icon">
                <ion-icon name="CoverArt"></ion-icon>
            </div>
            <label>Cover Article</label>
        </span>
    </div>
    <!--Article 1-->
    <div class="holder">
        <input class="cont" type="radio" name="services" value="article1">
        <span>
            <div class="icon">
                <ion-icon name="Article1"></ion-icon>
            </div>
            <label>Featured Article 1</label>
        </span>
    </div>
    <!--Article 2-->
    <div class="holder">
        <input class="cont" type="radio" name="services" value="article2">
        <span>
            <div class="icon">
                <ion-icon name="Article2"></ion-icon>
            </div>
            <label>Featured Article 2</label>
        </span>
    </div>
    <!--Article 3-->
    <div class="holder">
        <input class="cont" type="radio" name="services" value="article3">
        <span>
            <div class="icon">
                <ion-icon name="Article3"></ion-icon>
            </div>
            <label>Featured Article 3</label>
        </span>
    </div>
    </div>
    <button id="confirmBtn">Confirm</button>
    <script src="../JS/feurmoris.js"></script>
    <script>
    document.getElementById('confirmBtn').addEventListener('click', function() {
      const selected = document.querySelector('input[name="services"]:checked').value;

      // Redirect based on choice
      switch(selected) {
        case 'cover':
          window.location.href = 'Cover_article.html';
          break;
        case 'article1':
          window.location.href = 'Article1.html';
          break;
        case 'article2':
          window.location.href = 'Article2.html';
          break;
        case 'article3':
          window.location.href = 'Article3.html';
          break;
        default:
          alert('Please select an option.');
      }
    });
    
  </script>
  <script>
    const btnClick = document.getElementById("btnClick");
    const confirmBtn = document.getElementById("confirmBtn");
    const btnClose = document.getElementById("btnClose")

        btnClick.addEventListener("click", () => {
        confirmBtn.style.display = "none";
        
    });
        btnClose.addEventListener("click", () =>{
            confirmBtn.style.display = "block";
        })
  </script>
</body>
</html>

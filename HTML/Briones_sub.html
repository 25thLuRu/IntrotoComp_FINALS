            text-decoration: none;
            font-size: 0.85rem;
            transition: background-color 0.2s, color 0.2s;
            background-color: transparent;
            cursor: pointer;
        }
        
        .subject-link:hover,
        .subject-link:focus {

            color: #111;
            outline: none;
        }

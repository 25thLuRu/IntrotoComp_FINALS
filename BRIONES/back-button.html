<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Movement Competency</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            background-color: #111;
            font-family: 'Press Start 2P', cursive;
            color: #00ffcc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
        }
        
        header {
            font-weight: bold;
            font-size: 1.3rem;
            color: #ff0;
            /* pixel yellow text */
            text-align: center;
            margin-bottom: 40px;
            user-select: none;
        }
        
        .container {
            border: 2px solid #00ffcc;
            /* neon cyan border */
            border-radius: 8px;
            width: 500px;
            background-color: transparent;
            padding: 20px;
            box-sizing: border-box;
            color: #00ffcc;
            min-height: 40px;
        }
        
        a.back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            border: 2px solid #00ffcc;
            border-radius: 8px;
            color: #00ffcc;
            text-decoration: none;
            font-size: 0.75rem;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        
        a.back-button:hover,
        a.back-button:focus {
            background-color: #00ffcc;
            color: #111;
            outline: none;
        }
    </style>
</head>

<body>

    <header>Movement Competency</header>

    <a href="/HTML/Briones_sub.html" class="back-button" tabindex="1">← Back to Subject Selection</a>

    <div class="container">
        <!-- content area is empty as requested -->
    </div>

</body>

</html>

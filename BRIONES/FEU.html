<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>FEUR Events</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body {
            background-color: #111;
            font-family: 'Press Start 2P', cursive;
            color: #00ffcc;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
        }
        
        header {
            font-weight: bold;
            font-size: 1.3rem;
            color: #ff0;
            /* pixel yellow text */
            text-align: center;
            margin-bottom: 40px;
            user-select: none;
        }
        
        .container {
            border: 2px solid #00ffcc;
            /* neon cyan border */
            border-radius: 8px;
            width: 1500px;
            background-color: transparent;
            padding: 20px;
            box-sizing: border-box;
            color: #00ffcc;
        }
        /* Mimic the input box style but leave it empty */
        
        .file-upload-box {
            border: 2px solid #00ffcc;
            background-color: black;
            padding: 350px;
            font-size: 0.75rem;
            user-select: none;
            min-height: 40px;
        }
    </style>
</head>

<body>

    <header>FEUR Events</header>

    <div class="file-upload-box">
        <img src="../BRIONES/EVENTS/FEC_1.jpg" alt="FEU Events Picture 1" class="event-image">
        <img src="../BRIONES/EVENTS/FEC_2.jpg" alt="FEU Events Picture 2" class="event-image">
    </div>

    <style>
        .file-upload-box {
            border: 2px solid #00ffcc;
            background-color: black;
            padding: 20px;
            font-size: 0.75rem;
            user-select: none;
            min-height: 700px;
            /* makes your box tall */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .event-image {
            max-width: 100%;
            max-height: 100%;
            border: 2px solid #00ffcc;
        }
    </style>

    <a href="/HTML/Briones_sub.html" class="back-button" tabindex="1">← Back to Subject Selection</a>


</body>

</html>
